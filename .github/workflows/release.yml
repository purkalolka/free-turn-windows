name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'

permissions:
  contents: write

env:
  GO_VERSION: "1.26.7"

jobs:
  build-windows:
    name: Build Windows Desktop & CLI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install Frontend Dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build Wails Desktop Application
        working-directory: desktop
        run: wails build -ldflags "-checklinkname=0 -s -w" -trimpath

      - name: Build Windows CLI Binaries & Package Portable ZIP
        shell: pwsh
        run: |
          $ver = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          New-Item -ItemType Directory -Force -Path dist
          
          # 1. Build CLI client and server
          go build -ldflags "-s -w -checklinkname=0 -X main.version=$ver" -trimpath -o dist/client-windows-amd64.exe ./cmd/client
          go build -ldflags "-s -w -checklinkname=0 -X main.version=$ver" -trimpath -o dist/server-windows-amd64.exe ./cmd/server
          
          # 2. Package Portable ZIP
          $stage = "portable-stage"
          New-Item -ItemType Directory -Force -Path $stage
          Copy-Item "desktop/build/bin/freeturn-desktop.exe" -Destination "$stage/FreeTurn.exe"
          Copy-Item "desktop/backend/wintunnel/assets/wintun.dll" -Destination "$stage/wintun.dll"
          Copy-Item "scripts/windows/Run_Admin.bat" -Destination "$stage/Run_Admin.bat"
          Copy-Item "scripts/windows/README.txt" -Destination "$stage/README.txt"
          
          $zipName = "FreeTurn-Windows-Portable-$ver.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$zipName" -Force
          
          # 3. Generate SHA-256 Checksums
          Set-Location dist
          Get-FileHash -Algorithm SHA256 * | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content checksums.txt
          Get-Content checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FreeTurn Windows Client ${{ inputs.tag || github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
